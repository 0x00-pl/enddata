[tool.poetry]
name = "enddata"
version = "0.1.0"
description = "明日方舟:终末地 战斗与生产数据采集、分析与展示(标准库实现,零第三方依赖)"
authors = ["enddata"]
readme = "README.md"
license = "MIT"
packages = [
    { include = "enddata", from = "src" },
    { include = "collection", from = "src" },
    { include = "analysis", from = "src" },
    { include = "tools", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.10"
# 采集走标准库(urllib/subprocess),分析走 json/csv;
# z3-solver 为配方 z3 求解器(analysis.solvers.z3)的唯一第三方依赖
z3-solver = "^5.1.0"

[tool.poetry.scripts]
enddata = "enddata.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
